<div class="card shadow-sm border-0 rounded-4 p-3 bg-white">
  <ul class="sidebar-nav list-group list-group-flush">
    {% if user.is_authenticated %}
      <li class="list-group-item px-2 py-3 border-0 bg-light rounded-3 mb-3">
        <div class="d-flex align-items-center mb-2">
          <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px;">
            <i class="bi bi-person-fill fs-5"></i>
          </div>
          <div>
            <span class="d-block text-muted small text-uppercase fw-semibold" style="font-size: 0.7rem;">User</span>
            <span class="fw-bold text-dark">{{ user.username }}</span>
          </div>
        </div>
        <form action="{% url 'logout' %}" method="post" class="w-100">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-danger btn-sm w-100 rounded-pill d-flex align-items-center justify-content-center">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </button>
        </form>
      </li>
    {% else %}
      <li class="list-group-item px-2 py-1 border-0 mb-2">
        <a href="{% url 'login' %}" class="btn btn-primary w-100 rounded-pill text-white shadow-sm">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign in
        </a>
      </li>
      <li class="list-group-item px-2 py-1 border-0 mb-3">
        <a href="{% url 'register' %}" class="btn btn-outline-primary w-100 rounded-pill shadow-sm">
          <i class="bi bi-person-plus me-1"></i> Sign up
        </a>
      </li>
    {% endif %}

    <li class="list-group-item px-2 py-1 border-0 mb-1">
      <a href="{% url 'index' %}" class="nav-link text-dark px-3 py-2 rounded-3 d-flex align-items-center">
        <i class="bi bi-house-door me-3 text-secondary fs-5"></i> Home
      </a>
    </li>
    <li class="list-group-item px-2 py-1 border-0 mb-1">
      <a href="{% url 'projects:project_list' %}" class="nav-link text-dark px-3 py-2 rounded-3 d-flex align-items-center">
        <i class="bi bi-folder me-3 text-success fs-5"></i> Projects
      </a>
    </li>
    <li class="list-group-item px-2 py-1 border-0 mb-1">
      <a href="{% url 'tasks:task_list' %}" class="nav-link text-dark px-3 py-2 rounded-3 d-flex align-items-center">
        <i class="bi bi-check2-square me-3 text-warning fs-5"></i> Tasks
      </a>
    </li>
    <li class="list-group-item px-2 py-1 border-0 mb-1">
      <a href="{% url 'workers:worker-list' %}" class="nav-link text-dark px-3 py-2 rounded-3 d-flex align-items-center">
        <i class="bi bi-people me-3 text-primary fs-5"></i> Workers
      </a>
    </li>
  </ul>
</div>
