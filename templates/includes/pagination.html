{% load query_transform %}
{% if is_paginated %}
  <nav aria-label="Page navigation" class="mt-4">
    <ul class="pagination justify-content-center">
      {% if page_obj.has_previous %}
        <li class="page-item">
          <a class="page-link rounded-start-pill px-3 shadow-sm" href="?{% query_transform request page=page_obj.previous_page_number %}">
            <i class="bi bi-chevron-left"></i> Prev
          </a>
        </li>
      {% endif %}
      <li class="page-item active disabled">
        <span class="page-link px-4 border-0 shadow-sm">{{ page_obj.number }} of {{ paginator.num_pages }}</span>
      </li>
      {% if page_obj.has_next %}
        <li class="page-item">
          <a class="page-link rounded-end-pill px-3 shadow-sm" href="?{% query_transform request page=page_obj.next_page_number %}">
            Next <i class="bi bi-chevron-right"></i>
          </a>
        </li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
