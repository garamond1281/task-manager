{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="container my-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
      <h1 class="h3 fw-bold text-dark mb-4">{{ object|yesno:"Update,Create"}} Task</h1>
      <form action="" method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-flex justify-content-end gap-2 mt-4">
          <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
          <input class="btn btn-primary rounded-pill px-4 shadow-sm" type="submit" value="Submit">
        </div>
      </form>
    </div>
  </div>
{% endblock %}
