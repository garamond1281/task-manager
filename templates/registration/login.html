{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="container my-5" style="max-width: 500px;">
    <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
      <div class="text-center mb-4">
        <h1 class="h3 fw-bold text-dark">Login</h1>
      </div>

      {% if form.errors %}
        <div class="alert alert-danger rounded-3 py-2 small text-center" role="alert">
          Invalid credentials
        </div>
      {% endif %}

      <form action="{% url "login" %}" method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-grid mt-4">
          <input class="btn btn-primary rounded-pill py-2 shadow-sm" type="submit" value="Submit">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
      </form>

      <!-- Додано блок з посиланням на реєстрацію -->
      <div class="text-center mt-3">
        <p class="text-muted small mb-0">
          Don't have an account? <a href="{% url 'register' %}" class="text-primary text-decoration-none fw-semibold">Register</a>
        </p>
      </div>
    </div>
  </div>
{% endblock %}
